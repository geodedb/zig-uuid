# Pre-commit configuration
# https://pre-commit.com/

default_stages: [pre-commit]
fail_fast: false

repos:
  # Standard pre-commit hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
    exclude: ^(zig-out/|\.zig-cache/)
  - id: end-of-file-fixer
    exclude: ^(zig-out/|\.zig-cache/)
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
  - id: check-toml
  - id: check-xml
  - id: check-added-large-files
    args: [--maxkb=1024]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
  - id: detect-private-key

  # Shell linting
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error, --shell=bash]

  # Markdown linting
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.47.0
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013, MD033, MD041, MD024, MD060, MD036, MD051, MD052, MD055, --]
    exclude: ^CHANGELOG\.md$

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^\.gitlab-ci\.yml$

  # Conventional commits
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.12.1
  hooks:
  - id: commitizen
    stages: [commit-msg]

  # Local Zig hooks
- repo: local
  hooks:
  - id: zig-fmt
    name: zig fmt (check)
    entry: zig fmt --check
    language: system
    files: \.zig$
    pass_filenames: false
    args: [src/, tests/, examples/, benchmarks/, build.zig]
    exclude: ^(zig-out/|\.zig-cache/)

  - id: check-todos
    name: check TODOs
    entry: bash
    args:
    - -c
    - |
      git diff --cached --name-only | xargs grep -l -E "(TODO|FIXME|XXX|HACK)" 2>/dev/null \
        && echo "Warning: Found TODO/FIXME markers in staged files" && exit 0 || exit 0
    language: system
    pass_filenames: false
    verbose: true

  - id: zig-build
    name: zig build (check)
    entry: zig build check
    language: system
    pass_filenames: false
    files: \.(zig|zon)$
    exclude: ^(zig-out/|\.zig-cache/)
    stages: [pre-push]

  - id: zig-test
    name: zig test
    entry: zig build test
    language: system
    pass_filenames: false
    files: \.(zig|zon)$
    exclude: ^(zig-out/|\.zig-cache/)
    stages: [pre-push]

  - id: cross-compile-check
    name: cross-compile (required targets)
    entry: bash
    args:
    - -c
    - make cross-compile-required
    language: system
    files: \.(zig|zon)$
    exclude: ^(zig-out/|\.zig-cache/)
    pass_filenames: false
    stages: [pre-push]

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  skip: [zig-fmt, zig-build, zig-test, cross-compile-check]
