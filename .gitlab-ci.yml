---
# GitLab CI/CD Pipeline for uuid
# SPDX-License-Identifier: Apache-2.0

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.2.1

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  ZIG_VERSION: "0.15.2"

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release

# Zig installation template
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils
  - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
  - tar -xf zig.tar.xz
  - export PATH="$PWD/zig-linux-x86_64-${ZIG_VERSION}:$PATH"
  - zig version

# Build job (QC-18: use `zig build check` so all source files are actually
# type-checked.  `zig build` with no installArtifact in build.zig is a no-op
# for source compilation — only the build-runner binary gets compiled.)
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests — verifies correctness under the production optimization
# level and catches issues that Debug safety checks obscure (PERF-06).
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# Examples build verification (QC-15: ensures API drift is caught in CI)
build-examples:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build examples
  needs: []

# Cross-compilation checks (QC-8, QC-19: use `zig build check-cross` which
# compiles all five target triples in a single invocation via the check-cross
# step defined in build.zig.  The previous `zig build -Dtarget=X` invocations
# were no-ops for the same reason as QC-18 — no installArtifact in build.zig.)
test-cross-build:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check-cross
  needs:
    - build

# Bench build verification (QC-20: ensures bench/main.zig compiles and stays
# in sync with the public API; catches API drift that unit tests may miss.)
build-bench:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build bench -Doptimize=ReleaseFast
  needs: []
