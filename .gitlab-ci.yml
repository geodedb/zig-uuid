---
# GitLab CI/CD Pipeline for uuid
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    - company
    # Exclude the Windows PowerShell runner from the `company` pool — every
    # job in this file is a bash/Linux job (Windows coverage is cross-compile
    # only, via test-cross-build).
    - linux

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.55.6

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.55.6

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.55.6
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.55.6

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.55.6
    inputs:
      # Create the GitLab Release with CI_JOB_TOKEN: the group GITLAB_TOKEN
      # lacks api scope, so the default glab path fails with 403 (SONNY-2447).
      release_auth: job_token
      # x86: create-release runs the amd64-only release-cli image; on the ARM
      # Lab runners it fails with "exec format error" (v0.1.8 tag pipeline).
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.55.6

variables:
  ZIG_VERSION: "0.16.0"

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION (0.16.0).
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# GAP-DOC-17: root.zig `version` must match build.zig.zon `.version`.
# Two sources of truth drifted at the v0.1.1 bump; this gate prevents a repeat.
version-consistency:
  stage: lint
  image: debian:bookworm-slim
  script:
    - ZON_V=$(grep '\.version = ' build.zig.zon | sed 's/.*"\(.*\)".*/\1/')
    - ROOT_V=$(grep 'pub const version = ' src/root.zig | sed 's/.*"\(.*\)".*/\1/')
    - echo "zon=$ZON_V root=$ROOT_V"
    - test "$ZON_V" = "$ROOT_V"

# Build job (QC-18: use `zig build check` so all source files are actually
# type-checked.  `zig build` with no installArtifact in build.zig is a no-op
# for source compilation — only the build-runner binary gets compiled.)
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests — verifies correctness under the production optimization
# level and catches issues that Debug safety checks obscure (PERF-06).
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests — verifies correctness under size-optimized builds and
# catches issues that Debug safety checks obscure (QC-68).
test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Examples build verification (QC-15: ensures API drift is caught in CI)
build-examples:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build examples
  needs: []

# Cross-compilation checks (QC-8, QC-19, GAP-CI-01): invoke the per-module
# `zig build check` step once per target triple via `-Dtarget=<triple>`.
# The former `check-cross` aggregate step was removed from build.zig because
# it created per-target module copies rooted at src/root.zig, which triggered
# duplicate-module diamond errors in sibling consumers ("src/uuid.zig: file
# exists in modules 'json' and 'json0'").  The looped invocation below
# preserves cross-target coverage without re-introducing that pathology.
test-cross-build:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - for t in x86_64-linux-gnu aarch64-linux-gnu x86_64-macos aarch64-macos x86_64-windows-gnu; do echo "=== $t ==="; zig build check -Dtarget=$t || exit 1; done
  needs:
    - build

# Coverage-guided fuzz testing (QC-59).
# Runs with a 60-second timeout so the job always terminates.
#
# SEC-R5-02: The previous `|| true` suppressed ALL non-zero exits, including
# genuine fuzz crashes (non-zero, non-124 exit codes).  The corrected script
# distinguishes timeout (rc=124, expected) from a real crash (any other
# non-zero rc, which now fails the job so engineers are notified).
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) → pass
#   other : fuzzer found a crash → fail the job
#
# The fuzz corpus artifact is uploaded on failure so the crashing input
# is recoverable after the runner container exits.
#
# The job is restricted to scheduled pipelines and manual triggers to
# avoid slowing down every MR pipeline.
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# PERF-26 + INV-01: bench-regression with hard threshold gate.
#
# Runs the structured JSON benchmark suite (single-thread + multi-thread
# contention) and compares every `latest*.json` against its committed
# `benchmarks/results/baseline*.json` counterpart via the walker-mode
# `bench-compare-all` step. Regressions beyond PERF26_THRESHOLD (default
# 15%) fail the job. Secondary lockfree_fallbacks drift is reported as a
# WARN but does not fail (INV-01 guidance). `allow_failure` is omitted so
# a hard regression blocks the merge-train.
#
# Regenerate baselines whenever an intentional perf change lands:
#   zig build bench -Doptimize=ReleaseFast -- \
#       --output benchmarks/results/baseline.json
#   zig build bench-contention -Doptimize=ReleaseFast -- \
#       --output benchmarks/results/baseline_contention.json
#   git add benchmarks/results/baseline*.json && git commit
#
# The 15% threshold absorbs runner-to-runner jitter and ReleaseFast
# non-determinism. The compare tool additionally widens the effective
# gate to max(threshold, 3*stddev) so noisy rows still have a sensible
# floor.
#
# INV-01 pinning: when the runner has >= 4 cores, bench invocations are
# wrapped with `taskset -c 2-N` so CI machinery on cores 0-1 does not
# perturb contention scenarios. Skipped when nproc < 4 (tiny runner =
# no meaningful isolation possible). Controlled by BENCH_PIN_CORES;
# set to `"0"` to disable pinning explicitly.
#
# Artifacts retain the fresh-run JSONs + compare report for 90 days.
bench-regression:
  stage: fuzz
  image: debian:bookworm-slim
  # Pin bench jobs to the OVH dedicated runners (linux excludes the Windows
  # runner that also carries `dedicated`): consistent bare-metal hardware with
  # local disk. The k8s cluster runner's network-backed storage makes the
  # fsync-bound state suite exceed the 1h job timeout, and machine-to-machine
  # variance defeats the regression gate (INV-01 spirit).
  tags:
    - company
    - linux
    - dedicated
  variables:
    PERF26_THRESHOLD: "0.15"
    BENCH_PIN_CORES: "1"
  before_script:
    - *install-zig
    - apt-get update && apt-get install -y --no-install-recommends util-linux procps
  script:
    - |
      # Resolve the taskset prefix once so both bench invocations use
      # an identical isolation envelope.
      if [ "${BENCH_PIN_CORES:-1}" = "1" ] && command -v taskset >/dev/null 2>&1 && [ "$(nproc)" -ge 4 ]; then
        LAST_CORE=$(($(nproc) - 1))
        if [ "$LAST_CORE" -gt 17 ]; then LAST_CORE=17; fi
        TASKSET_PREFIX="taskset -c 2-$LAST_CORE"
        echo "INV-01: pinning bench to cores 2-$LAST_CORE (nproc=$(nproc))"
      else
        TASKSET_PREFIX=""
        echo "INV-01: taskset pin skipped (nproc=$(nproc), BENCH_PIN_CORES=${BENCH_PIN_CORES:-1})"
      fi
      export TASKSET_PREFIX
    # PERF-43: run every benchmark suite that has a committed baseline so
    # bench-compare-all actually has a candidate for each pair.  Previously
    # only `bench` + `bench-contention` ran and the walker silently skipped
    # baseline_state.json / baseline_micro_*.json.  The three micro suites
    # are invoked individually (not via the `bench-micro` aggregate step)
    # because they all forward `b.args` to the same `--output` path and
    # would otherwise clobber each other.
    - $TASKSET_PREFIX zig build bench -Doptimize=ReleaseFast -- --output benchmarks/results/latest.json
    - $TASKSET_PREFIX zig build bench-contention -Doptimize=ReleaseFast -- --output benchmarks/results/latest_contention.json --runs 3
    - $TASKSET_PREFIX zig build bench-state -Doptimize=ReleaseFast -- --output benchmarks/results/latest_state.json
    - $TASKSET_PREFIX zig build bench-micro-parse -Doptimize=ReleaseFast -- --output benchmarks/results/latest_micro_parse.json
    - $TASKSET_PREFIX zig build bench-micro-format -Doptimize=ReleaseFast -- --output benchmarks/results/latest_micro_format.json
    - $TASKSET_PREFIX zig build bench-micro-hash -Doptimize=ReleaseFast -- --output benchmarks/results/latest_micro_hash.json
    - |
      # State-suite benches are fsync-bound — throughput is a property of the
      # runner's disk, not the code. Cross-machine comparison against committed
      # baselines is meaningless, so state pairs report WARN instead of FAIL.
      zig build bench-compare-all -- \
        --threshold "${PERF26_THRESHOLD:-0.15}" \
        --warn-only state 2>&1 | tee bench-regression-report.txt
  artifacts:
    when: always
    paths:
      - benchmarks/results/latest.json
      - benchmarks/results/latest_contention.json
      - benchmarks/results/latest_state.json
      - benchmarks/results/latest_micro_parse.json
      - benchmarks/results/latest_micro_format.json
      - benchmarks/results/latest_micro_hash.json
      - bench-regression-report.txt
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  needs:
    - build

# Bench build verification (QC-20: ensures every bench/ source compiles and
# stays in sync with the public API; catches API drift that unit tests may
# miss).
# PERF-15: use bench-check (compile only) instead of running the full suite.
# Running the full suite in CI on every push would waste CI minutes;
# compile-only is sufficient to verify the benchmark sources remain valid.
build-bench:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build bench-check -Doptimize=ReleaseFast
  needs: []

# PERF-44: MR-scoped micro-benchmark regression gate.
#
# `bench-regression` (above) only runs on `main` + scheduled pipelines, so
# pre-merge regressions in the three micro suites (parse / format / hash)
# are not caught until after the MR lands. This job re-runs the three
# cheapest benches on every merge-request pipeline and compares each against
# its committed baseline at a 10% threshold. The full `bench-regression`
# suite (which also includes contention + state) stays main/schedule-only
# because it is the expensive piece.
#
# Rationale for 10% (vs. 15% on main): the micro suites are single-threaded
# and have tight, stable distributions, so a tighter gate is reasonable.
# INV-01 pinning mirrors the main bench-regression job (skip when nproc<4).
bench-micro-mr:
  stage: fuzz
  image: debian:bookworm-slim
  # Same dedicated-runner pin as bench-regression (consistent hardware for
  # comparable bench numbers; avoids slow network-backed storage).
  tags:
    - company
    - linux
    - dedicated
  variables:
    MICRO_THRESHOLD: "0.10"
    # PERF-46: contention gate at 10% on MR (bench-regression keeps 15% on main, PERF26_THRESHOLD).
    # The 10% MR threshold plus `--runs 3` across-run median gives us
    # statistical power to flag ~6-7% regressions that within-run stddev alone
    # cannot distinguish from scheduler jitter (see PERF-45).
    CONTENTION_THRESHOLD: "0.10"
    BENCH_PIN_CORES: "1"
  before_script:
    - *install-zig
    - apt-get update && apt-get install -y --no-install-recommends util-linux procps
  script:
    - |
      if [ "${BENCH_PIN_CORES:-1}" = "1" ] && command -v taskset >/dev/null 2>&1 && [ "$(nproc)" -ge 4 ]; then
        LAST_CORE=$(($(nproc) - 1))
        if [ "$LAST_CORE" -gt 17 ]; then LAST_CORE=17; fi
        TASKSET_PREFIX="taskset -c 2-$LAST_CORE"
        echo "INV-01: pinning bench to cores 2-$LAST_CORE (nproc=$(nproc))"
      else
        TASKSET_PREFIX=""
        echo "INV-01: taskset pin skipped (nproc=$(nproc), BENCH_PIN_CORES=${BENCH_PIN_CORES:-1})"
      fi
      export TASKSET_PREFIX
    - $TASKSET_PREFIX zig build bench-micro-parse -Doptimize=ReleaseFast -- --output benchmarks/results/latest_micro_parse.json
    - $TASKSET_PREFIX zig build bench-micro-format -Doptimize=ReleaseFast -- --output benchmarks/results/latest_micro_format.json
    - $TASKSET_PREFIX zig build bench-micro-hash -Doptimize=ReleaseFast -- --output benchmarks/results/latest_micro_hash.json
    # PERF-46: multi-run contention gate on MR.  `--runs 3` writes
    # `across_run_median_ops_per_sec` + `across_run_stddev_pct` into every
    # row; compare.zig prefers those fields over the single-invocation
    # throughput so the 10% threshold is evaluated against the across-run
    # median (PERF-45).
    - $TASKSET_PREFIX zig build bench-contention -Doptimize=ReleaseFast -- --output benchmarks/results/latest_contention.json --runs 3
    - zig build bench-compare -- --baseline benchmarks/results/baseline_micro_parse.json --candidate benchmarks/results/latest_micro_parse.json --threshold "${MICRO_THRESHOLD}"
    - zig build bench-compare -- --baseline benchmarks/results/baseline_micro_format.json --candidate benchmarks/results/latest_micro_format.json --threshold "${MICRO_THRESHOLD}"
    - zig build bench-compare -- --baseline benchmarks/results/baseline_micro_hash.json --candidate benchmarks/results/latest_micro_hash.json --threshold "${MICRO_THRESHOLD}"
    - zig build bench-compare -- --baseline benchmarks/results/baseline_contention.json --candidate benchmarks/results/latest_contention.json --threshold "${CONTENTION_THRESHOLD}"
  artifacts:
    when: always
    paths:
      - benchmarks/results/latest_micro_parse.json
      - benchmarks/results/latest_micro_format.json
      - benchmarks/results/latest_micro_hash.json
      - benchmarks/results/latest_contention.json
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  needs:
    - build-bench

# ---------------------------------------------------------------------------
# FIPS-140-3 dual-mode test (-Dfips=true).
#
# Same provisioning as devnw/zig/tls: `zig build provision-fips` runs the
# pinned fips package's own scripts/install-openssl-fips.sh (hash-verified
# through build.zig.zon, signature verification forced with REQUIRE_GPG=1),
# then `make test-fips` runs the unit + integration suites against the
# validated FIPS provider. One job, so no OpenSSL artifact has to cross
# runners (the old fips-deps job called a `make deps` target this repo never
# had, and /usr/local/ssl can't be uploaded as an artifact anyway).
test-fips:
  stage: test
  image: debian:bookworm-slim
  timeout: 45m
  variables:
    OPENSSL_VERSION: "3.6.5"
    OPENSSL_PREFIX: "/usr/local/ssl"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential perl wget curl xz-utils ca-certificates git sudo gnupg dirmngr python3
    - *install-zig
    - wget -q https://www.openssl-library.org/source/pubkeys.asc -O /tmp/openssl-pubkeys.asc
    - gpg --batch --import /tmp/openssl-pubkeys.asc
    - zig build provision-fips -Dfips=true -Dopenssl_path="${OPENSSL_PREFIX}" --summary all
  script:
    - make test-fips OPENSSL_PREFIX="${OPENSSL_PREFIX}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Disable empty merge_request_event pipelines: no job runs on merge_request_event,
# so MR pipelines are always empty, fail, and become the head pipeline that blocks
# Renovate auto-merge. Branch pipelines carry the real jobs; evaluate those.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always
